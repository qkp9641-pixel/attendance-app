name: Build Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q AttendanceApp-AndroidStudio-FIXED.zip -d extracted

          echo "===== PROJECT FILES ====="
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name build.gradle.kts -o -name build.gradle | head -1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== BUILD APK ====="
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR" -type f -path "*/app/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-APK
          path: ${{ env.APK_PATH }}
