name: Build Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          unzip -q AttendanceApp-AndroidStudio-FIXED.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android Project
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f -name gradlew -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found inside extracted project."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "Building from: $(pwd)"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK_PATH="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found at: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-APK
          path: ${{ env.APK_PATH }}
