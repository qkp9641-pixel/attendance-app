name: Build Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          unzip -q AttendanceApp-AndroidStudio-FIXED.zip -d extracted
          ls -la extracted

      - name: Build APK
        working-directory: extracted/attendance_android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-APK
          path: extracted/attendance_android/app/build/outputs/apk/debug/*.apk
