name: Build Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android Project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q AttendanceApp-AndroidStudio-FIXED.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name build.gradle.kts -type f | head -1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Update Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's#gradle-[0-9][0-9.]*-bin.zip#gradle-8.10.2-bin.zip#g' gradle/wrapper/gradle-wrapper.properties
            echo "Gradle wrapper updated to 8.10.2"
            cat gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK_PATH=$(find "${PROJECT_DIR}" -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found at: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-App-APK
          path: ${{ env.APK_PATH }}
